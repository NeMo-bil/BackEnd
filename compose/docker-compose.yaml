services:

  postgres:
    image: postgres:16
    container_name: nemobil-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  keycloak-postgres:
    image: postgres:16
    container_name: nemobil-keycloak-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: nemobil-keycloak
    restart: unless-stopped

    command:
      - start-dev

    environment:

      KC_DB: postgres

      KC_DB_URL:
        jdbc:postgresql://keycloak-postgres:5432/keycloak

      KC_DB_USERNAME:
        ${KEYCLOAK_DB_USER}

      KC_DB_PASSWORD:
        ${KEYCLOAK_DB_PASSWORD}

      KC_BOOTSTRAP_ADMIN_USERNAME:
        ${KEYCLOAK_ADMIN}

      KC_BOOTSTRAP_ADMIN_PASSWORD:
        ${KEYCLOAK_ADMIN_PASSWORD}

      KC_HEALTH_ENABLED: "true"

    ports:
      - "8080:8080"

    depends_on:
      keycloak-postgres:
        condition: service_healthy


  kafka:
    image: apache/kafka:3.9.0
    container_name: nemobil-kafka
    restart: unless-stopped

    environment:

      KAFKA_NODE_ID: 1

      KAFKA_PROCESS_ROLES:
        broker,controller

      KAFKA_LISTENERS:
        PLAINTEXT://:9092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS:
        PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES:
        CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS:
        1@kafka:9093

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR:
        1

      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR:
        1

      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR:
        1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS:
        0

      CLUSTER_ID:
        MkU3OEVBNTcwNTJENDM2Qk

    volumes:
      - kafka-data:/var/lib/kafka/data


volumes:

  postgres-data:

  keycloak-postgres-data:

  kafka-data: