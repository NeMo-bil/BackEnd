services:

  keycloak-postgres:
    image: postgres:16
    container_name: nemobil-keycloak-postgres
    restart: unless-stopped
    networks:
      - nemobil

    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: ${KEYCLOAK_DB_USER}
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}

    volumes:
      - keycloak-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${KEYCLOAK_DB_USER}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  stellio-postgres:
    image: postgres:16
    container_name: nemobil-stellio-postgres
    restart: unless-stopped
    networks:
      - nemobil

    environment:
      POSTGRES_DB: stellio
      POSTGRES_USER: ${STELLIO_DB_USER}
      POSTGRES_PASSWORD: ${STELLIO_DB_PASSWORD}

    volumes:
      - stellio-postgres-data:/var/lib/postgresql/data
      - ../config/stellio/init:/docker-entrypoint-initdb.d

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${STELLIO_DB_USER}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  keycloak:
    image: quay.io/keycloak/keycloak:26.5
    container_name: nemobil-keycloak
    restart: unless-stopped
    networks:
      - nemobil

    command:
      - start-dev
      - --import-realm

    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"

    volumes:
      - ../config/keycloak:/opt/keycloak/data/import

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "exec 3<>/dev/tcp/127.0.0.1/9000 && echo -e 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && cat <&3 | grep -q UP"
        ]
      interval: 10s
      timeout: 5s
      retries: 15

    ports:
          - "8080:8080"

    depends_on:
      keycloak-postgres:
        condition: service_healthy


  kafka:
    image: apache/kafka:3.9.0
    container_name: nemobil-kafka
    restart: unless-stopped
    networks:
      - nemobil

    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

    volumes:
      - kafka-data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      
  nodered:
    image: nodered/node-red:4.1
    container_name: nemobil-nodered
    restart: unless-stopped

    ports:
      - "1880:1880"

    networks:
      - nemobil

    volumes:
      - nodered-data:/data

    depends_on:
      kafka:
        condition: service_healthy

volumes:
  keycloak-postgres-data:
  kafka-data:
  stellio-postgres-data:
  nodered-data:
  
  
networks:
  nemobil:
    name: nemobil